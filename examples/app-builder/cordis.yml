# App Builder MVP composition. Inlines the three runtime App Builder
# plugins (project, scaffold, preview) on top of the standard coding-agent
# plugin stack. The persona plugin is preset-only (the persona row is
# scope-only by design), so the App Builder identity is mounted as the
# deployment persona via the `agent-spine.config.persona` field below.

# User-settings document (`$DSH_HOME/settings.yaml`, hot-reloaded).
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# Credential store: live process environment over `$DSH_HOME/.credentials.yaml`.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# DeepSeek adapter. The with-key twin uses the same row; the keyless
# snapshot disables it and mounts a mock adapter instead.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
        contextWindow: 128000

# Managed child-process groups for the bash executor.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    timeoutMs: 60000

# Background-job registry; required by the preview tool.
- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# Sandbox policy in workspace-write mode so scaffold can create the
# project directory and preview can read the package.json.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

# Filesystem capability, observation policy, and the model-facing
# `write` / `str_replace_editor` tools.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Agent spine loaded BEFORE the App Builder plugins so the `agent`
# service they inject is already published. The persona pulls the App
# Builder identity out of the persona package via `createRequire` so a
# single edit there refreshes every composition; the keyless + with-key
# snapshots override it through `cordis-plugin-include.patches`.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: !!js "(function(){const c=require('node:module').createRequire(import.meta.url||__filename);return c('@deepseek-ai/dsh-app-builder-persona/text').APP_BUILDER_PERSONA})()"

# App Builder MVP runtime plugins (inlined from
# `@deepseek-ai/dsh-app-builder` `cordis.patch.yml`; the bundle JS plugin
# is intentionally a no-op so direct `cordis.yml` compositions can mount
# the same plugin set without going through the profile launcher).
- id: app-builder-project
  name: '@deepseek-ai/dsh-app-builder-project'

- id: app-builder-scaffold
  name: '@deepseek-ai/dsh-app-builder-scaffold'

- id: app-builder-preview
  name: '@deepseek-ai/dsh-app-builder-preview'

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
