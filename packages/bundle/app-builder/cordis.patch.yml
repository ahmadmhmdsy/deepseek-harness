# The dsh-app-builder bundle patch: applied as ONE insert over the dsh-base
# profile root, registering the App Builder MVP plugins. Last write wins per
# row, so a user's profile cordis.patch.yml can address any of these rows by
# id to override defaults.

- insert:
    # Project entity + projection unit. Owns the per-project session enumeration
    # (ctx.sessions + ctx.sessionQuery).
    - id: app-builder-project
      name: '@deepseek-ai/dsh-app-builder-project'
      config:
        defaultProfile: app-builder

    # Scaffold tool: composes dsh-tool-fs + dsh-tool-str-replace-editor +
    # dsh-tool-bash to materialize a template project under the project cwd.
    - id: app-builder-scaffold
      name: '@deepseek-ai/dsh-app-builder-scaffold'

    # Preview tool: starts the project dev server via dsh-tool-bash (background),
    # waits for readiness via an HTTP-poll helper, returns the preview URL.
    - id: app-builder-preview
      name: '@deepseek-ai/dsh-app-builder-preview'

    # App Builder persona: scopes the agent to project scaffolding + iteration.
    - id: app-builder-persona
      name: '@deepseek-ai/dsh-app-builder-persona'

    # Snapshot bridge: in-memory { projects, devServers } projection the
    # browser projects pane polls; also feeds the BFF's getPreview method.
    - id: app-builder-snapshot-bridge
      name: '@deepseek-ai/dsh-app-builder-snapshot-bridge'
      inject: [webServer, appBuilderProjects]

    # BFF Typert Remote: 13 Remote methods (project CRUD, session lifecycle,
    # SSE event subscription, preview, deploy, usage). Auto-discovered by the
    # api-gateway mounted in @deepseek-ai/dsh-base. Requires
    # @deepseek-ai/dsh-api-session-controller for the session methods and the
    # SSE stream; mounts here so a downstream profile gets the full BFF.
    # The deploy method delegates to ctx.appBuilderDeployment, so the
    # deployment plugin must be mounted in the same composition.
    - id: app-builder-api
      name: '@deepseek-ai/dsh-app-builder-api'

    # Deployment pipeline: SAST / SCA / secrets gates + approval gate + push
    # step. The pipeline emits deployment/started|succeeded|failed events and
    # backs the BFF's `deploy` Typert Remote method. Phase 2.1 ships the
    # MVP; Phase 2.5 replaces the synthetic local push with a production hook.
    - id: app-builder-deployment
      name: '@deepseek-ai/dsh-app-builder-deployment'

    # ToolPolicy manifest: typed per-tool ToolPolicy schema + tools/pre-execute
    # listener + audit toolPolicy/decision event. Falls back to
    # ctx.permissionPresets.current(events) for tools without a declared
    # policy. Intent + audit, NOT authority — real authority comes from
    # sandbox-mode fences and capability seams. Phase 2.2.
    - id: app-builder-tool-policy
      name: '@deepseek-ai/dsh-app-builder-tool-policy'

    - id: api-session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'
